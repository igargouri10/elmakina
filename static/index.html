<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELMAKINA LIVE</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap');:root{color-scheme:dark;--bg:#0b0e15;--panel:#171b26;--border:#323746;--text:#f9f7f0;--muted:#a5aab8;--yellow:#ffe600;--pink:#f66c82}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#202444,#0b0e15 55%);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}.shell{max-width:1180px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;padding:13px 0 26px;gap:8px;border-bottom:1px solid var(--border)}h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif}.brand{font-size:29px;font-weight:800;letter-spacing:-1px}.brand b{color:var(--yellow)}.tag{border:1px solid #4b5265;border-radius:999px;padding:7px 12px;color:var(--muted);font-size:12px;font-weight:700}.panel{border:1px solid var(--border);background:linear-gradient(130deg,#1b1f2d,#131722);border-radius:20px;padding:23px;margin-top:20px;box-shadow:0 12px 44px #0002}.intro{max-width:530px;margin:55px auto}.eyebrow{color:var(--yellow);letter-spacing:3px;font-size:11px;font-weight:800}.intro h1{font-size:clamp(38px,6vw,64px);line-height:1.06;margin:18px 0}.muted{color:var(--muted);line-height:1.5}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.line{height:1px;background:var(--border);margin:23px 0}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}input,select{background:#0f1320;border:1px solid #41495a;color:white;border-radius:10px;padding:13px;outline:none;width:100%;font:inherit}input:focus,select:focus{border-color:var(--yellow)}button{font:inherit;font-weight:800;font-size:13px;cursor:pointer;border:none;border-radius:10px;padding:12px 17px;background:#363d51;color:white;transition:.15s}button:hover:not(:disabled){filter:brightness(1.14);transform:translateY(-1px)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--yellow);color:#10131b}.danger{background:#e45c6d;color:#160b11}.outline{border:1px solid #586075;background:transparent}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(285px,1fr);gap:16px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.player{border:1px solid var(--border);background:#101520;border-radius:14px;padding:13px}.player.current{border-color:var(--yellow);box-shadow:0 0 0 1px #ffe60055}.player.dead{opacity:.5}.pname{font-weight:800}.stat{font-size:13px;color:var(--muted);margin-top:5px}.hand{display:flex;flex-wrap:wrap;gap:12px}.playing{width:clamp(110px,15vw,160px);aspect-ratio:675/1050;object-fit:cover;border-radius:7px;box-shadow:5px 6px 0 #000;border:2px solid #fafafa}.playing.pick{cursor:pointer}.playing.pick:hover{outline:4px solid var(--yellow);transform:translateY(-3px)}.playing.selected{outline:5px solid var(--yellow)}.cardback{width:37px;height:53px;background:repeating-linear-gradient(45deg,#fff000 0 8px,#16171b 8px 16px);border:2px solid white;display:inline-block;border-radius:4px}.log{list-style:none;padding:0;margin:0;max-height:380px;overflow-y:auto}.log li{border-bottom:1px solid #313744;padding:9px 0;font-size:13px;color:#c3c7d2}.log li:last-child{color:white}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.actions button{flex:1 1 135px}.notice{border-left:4px solid var(--yellow);padding:12px;background:#29291a;border-radius:4px;margin:15px 0}.code{font-size:38px;font-weight:800;letter-spacing:8px;color:var(--yellow)}.copy{font-size:11px}.small{font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#7d2734;color:white;border:1px solid #ff6f85;border-radius:14px;padding:12px 18px;z-index:99;max-width:90vw}.hidden{display:none!important}.choicebox{background:#111522;border-radius:12px;padding:14px;margin:15px 0}h2{margin:2px 0 14px;font-size:23px}h3{margin:0 0 10px}.statusdot{color:#82eba6}a{color:var(--yellow)}@media(max-width:760px){.layout,.split{grid-template-columns:1fr}.shell{padding:13px}.panel{padding:17px}.playing{width:128px}.code{font-size:27px;letter-spacing:5px}.intro{margin:20px auto}}

/* Multiplayer tabletop */
.layout{grid-template-columns:minmax(0,2fr) minmax(300px,0.92fr)}
.tabletop{background:radial-gradient(ellipse at 50% 48%,#084d73 0%,#063456 68%,#03233f 100%);border:9px solid #04080e;border-radius:clamp(35px,6vw,85px);min-height:480px;position:relative;box-shadow:inset 0 0 0 3px #276080,0 22px 50px #0008;display:flex;flex-direction:column;justify-content:space-between;padding:20px;gap:20px;overflow:hidden}
.tabletop:before{content:"ELMAKINA";position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);font-size:clamp(36px,7vw,85px);font-family:'Space Grotesk',sans-serif;font-weight:800;letter-spacing:.12em;color:#ffffff0b;pointer-events:none}
.table-others{display:flex;flex-wrap:wrap;justify-content:space-evenly;gap:18px;z-index:1}.table-seat{text-align:center;background:#06182a94;border:1px solid #5a849a;border-radius:15px;padding:10px;min-width:115px;max-width:180px}.table-seat.turn-seat{border:2px solid var(--yellow)}.table-seat .playing{width:44px;margin:0 -6px 0 0}.table-seat .cardback{width:35px;height:52px}.seat-name{font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.table-center{z-index:1;text-align:center;font-weight:700;color:#b7deeb}.table-self{z-index:1;text-align:center;background:#06182a8a;border-radius:18px;padding:12px}.table-self .hand{justify-content:center}.table-self .playing{width:clamp(98px,11vw,145px)}
.chat-scroll{min-height:120px;max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:7px}.chat-line{background:#0b1322;border-radius:9px;padding:9px;word-wrap:break-word;font-size:13px}.chat-line b{color:#ffe600}.chat-entry{display:flex;gap:8px;margin-top:12px}.chat-entry input{min-width:0;flex:1}.dice-tile{border:1px solid #57677a;border-radius:12px;padding:10px;background:#101827;display:flex;justify-content:space-between;gap:15px}.dice-face{color:#ffe600;font-weight:900;font-size:22px}.dice-round{display:grid;gap:7px;margin:10px 0}.sidebar-stack{min-width:0}
@media(max-width:760px){.tabletop{min-height:420px;padding:12px;border-width:6px}.table-seat{min-width:95px;padding:7px}.table-self .playing{width:105px}.table-others{gap:6px}}
</style></head><body><div class="shell"><header><div class="brand">ELMAKINA <b>✳</b></div><div class="tag" id="connection">● OFFLINE</div></header><main id="app"></main></div><div id="toast" class="toast hidden"></div><script>
const artwork={'Police':'police','Colonel':'colonel','Thief':'thief','Terrorist':'terrorist','Tax Agent':'tax-agent','Business Woman':'business-woman','Politician':'politician'};const roles=Object.keys(artwork);let ws=null,s=null,token=localStorage.getItem('elmakina-player-token')||'',selected=[],pendingLogin=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));function card(role,click=''){return `<img class="playing ${click?'pick':''}" src="/static/cards/${artwork[role]}.png" alt="${esc(role)}" ${click?`onclick="${click}"`:''}>`};function me(){return s?.players.find(p=>p.id===s.you)}function person(id){return s?.players.find(p=>p.id===id)?.name||'Someone'}function toast(text){let e=$('toast');e.textContent=text;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),4500)}function send(type,data={}){if(ws?.readyState!==1)return toast('Connection lost. Reconnecting...');ws.send(JSON.stringify({type,...data}))}function connect(data){pendingLogin=data;const scheme=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${scheme}://${location.host}/ws`);$('connection').textContent='● CONNECTING';ws.onopen=()=>{send(data.type,{...data,token});$('connection').textContent='● LIVE'};ws.onmessage=ev=>{const d=JSON.parse(ev.data);if(d.type==='error'){toast(d.message);return}if(d.type==='joined'){token=d.token;localStorage.setItem('elmakina-player-token',token);history.replaceState({},'',`/?room=${d.code}`)}if(d.type==='state'){s=d.state;selected=[];render()}};ws.onclose=()=>{$('connection').textContent='● DISCONNECTED';if(pendingLogin)setTimeout(()=>{if(ws.readyState===3)connect(pendingLogin)},2500)}}
function startPage(){let code=new URLSearchParams(location.search).get('room')||'';$('app').innerHTML=`<section class="panel intro"><div class="eyebrow">REAL-TIME MULTIPLAYER</div><h1>TRUST NOBODY.<br>CLAIM ANYTHING.</h1><p class="muted">Seven roles. Twenty-one cards. One survivor. Create a private room and play with friends on separate devices.</p><label>Your player name</label><input id="myname" maxlength="24" placeholder="e.g. Yassine" autocomplete="nickname"><div class="split" style="margin-top:15px"><button class="primary" onclick="login('create')">Create room</button><button onclick="login('join')">Join room</button></div><label>Room code (for joining)</label><input id="roomcode" value="${esc(code)}" maxlength="5" placeholder="ABCDE" style="text-transform:uppercase"><p class="small">For a private match, share the room code with your friends. Each player needs their own browser.</p></section>`}
function login(type){let name=$('myname').value.trim();if(!name)return toast('Enter a player name.');let code=$('roomcode').value.trim().toUpperCase();if(type==='join'&&!code)return toast('Enter a room code.');connect({type,name,code})}
function render(){
 if(!s)return startPage();
 const opponents=s.players.filter(x=>x.id!==s.you),self=me();
 const seats=opponents.map(x=>`<div class="table-seat ${x.id===s.turn?'turn-seat':''}"><div class="seat-name">${esc(x.name)}</div><div class="small">${x.coins} coins · ${x.remaining} cards</div><div>${Array.from({length:s.started?x.remaining:0},()=>'<span class="cardback"></span>').join('')}</div><div class="small">${x.connected?'● Online':'○ Offline'}</div></div>`).join('');
 const table=`<div class="tabletop"><div class="table-others">${seats||'<div class="small">Waiting for opponents...</div>'}</div><div class="table-center">BANK: ${s.bank} COINS</div><div class="table-self"><div class="seat-name">${esc(self.name)} (You) ${s.turn===s.you&&s.started?'★':''}</div><div class="small">${self.coins} coins · ${self.remaining} cards</div><div class="hand">${s.hand.map(x=>card(x)).join('')||'<p class="muted">Cards will appear when the game begins.</p>'}</div></div></div>`;
 const lobby=s.phase==='lobby'?`<section class="panel"><h2>Waiting room</h2><p class="muted">${s.players.length} connected players. Two-player games deal three cards each; games with three or more deal two.</p>${s.host===s.you?`<button class="primary" ${s.players.length<2?'disabled':''} onclick="send('start')">Roll dice & start (${s.players.length} players)</button>`:'<p>Waiting for host to roll dice and begin.</p>'}</section>`:'';
 const players=`<section class="panel"><h2>Players</h2><div class="players">${s.players.map(x=>`<div class="player ${x.id===s.turn?'current':''} ${x.remaining===0&&s.started?'dead':''}"><b>${esc(x.name)} ${x.id===s.you?'(you)':''}</b><div class="stat">${x.coins} coins · ${x.remaining} cards ${x.connected?'●':'○'}</div></div>`).join('')}</div></section>`;
 const chat=`<section class="panel"><h2>Game chat</h2><div class="chat-scroll" id="chat-list">${(s.chat||[]).map(m=>`<div class="chat-line"><b>${esc(m.player)}:</b> ${esc(m.text)}</div>`).join('')||'<p class="small">No messages yet.</p>'}</div><form class="chat-entry" onsubmit="sendChat(event)"><input id="chat-input" maxlength="400" placeholder="Message players..." autocomplete="off"><button class="primary" type="submit">Send</button></form></section>`;
 $('app').innerHTML=`<div class="between" style="margin-top:20px"><div><div class="eyebrow">ROOM CODE</div><div class="code">${esc(s.code)}</div></div><button class="outline" onclick="navigator.clipboard.writeText(location.href).then(()=>toast('Invite link copied'))">Copy invite link</button></div><div class="layout"><div>${table}${lobby}${players}</div><div class="sidebar-stack"><section class="panel"><h2>Game actions</h2><div class="small">Current player: ${esc(person(s.turn))}</div><div id="controls"></div></section>${chat}<section class="panel"><h2>Game log</h2><ul class="log">${s.log.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section></div></div>`;
 controls();const sc=$('chat-list');if(sc)sc.scrollTop=sc.scrollHeight;
}
function sendChat(ev){ev.preventDefault();const inp=$('chat-input');const message=inp?.value.trim();if(message){send('chat',{message});inp.value='';}}
function optionPlayers(includeSelf=false){return s.players.filter(x=>x.remaining>0&&(includeSelf||x.id!==s.you)).map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (${x.coins} coins, ${x.remaining} cards)</option>`).join('')}
function controls(){let e=$('controls'),q=s.pending,a=s.allowed||{},phase=s.phase;let h='';if(phase==='lobby')h='<p class="muted">Players are joining...</p>';else if(phase==='dice'){const rounds=(s.diceRounds||[]).map((round,i)=>`<div><b>Roll ${i+1}</b><div class="dice-round">${round.map(x=>`<div class="dice-tile"><span>${esc(x.name)}</span><span class="dice-face">⚄ ${x.roll}</span></div>`).join('')}</div></div>`).join('');h=`<div class="notice">Dice results — ${esc(person(s.firstPlayer))} starts!</div>${rounds}<button class="primary" ${s.diceReady.includes(s.you)?'disabled':''} onclick="send('dice_ready')">${s.diceReady.includes(s.you)?'Waiting for others...':'Ready to play'}</button>`;}else if(phase==='finished')h=`<div class="notice">🏆 ${esc(s.winner)} won the game!</div>`;else if(a.actions){h=`<div class="notice">It's your turn. Pick an action.</div><label>Target player</label><select id="target">${optionPlayers()}</select><div class="actions">${[['income','+1 income'],['aid','+2 foreign aid'],['coup','Coup (-7)'],['Police','Police'],['Colonel','Colonel (-4)'],['Thief','Thief'],['Terrorist','Terrorist (-3)'],['Tax Agent','Tax Agent'],['Business Woman','Business Woman'],['Politician','Politician']].map(([id,label])=>`<button ${id==='coup'&&me().coins<7||id==='Terrorist'&&me().coins<3||id==='Colonel'&&me().coins<4?'disabled':''} onclick="takeAction('${id}')">${label}</button>`).join('')}</div>`}
else if(phase==='reaction'){h=`<div class="notice"><b>${esc(person(q.actor))}</b> declared <b>${esc(q.action)}</b>${q.target?' against '+esc(person(q.target)):''}${q.action==='Colonel'&&q.accused?' of holding '+esc(q.accused):''}${q.action==='Politician'?' and wants to exchange cards':''}.${q.action==='Business Woman'?' Every opponent may independently request a coin as Tax Agent. The Business Woman may challenge each claim.':''}</div>`;if(a.canTax)h+=`<button class="primary" onclick="send('tax')">Claim Tax Agent: request 1 coin</button> `;if(a.canChallenge)h+=`<button class="danger" onclick="send('challenge')">Challenge: You're lying!</button> `;if(a.canBlock)h+=`<button onclick="send('block')">Block as ${esc({'aid':'Tax Agent','Police':'Police','Thief':'Thief','Terrorist':'Colonel'}[q.action])}</button> `;if(a.canPass)h+=`<button class="outline" onclick="send('pass')">Allow / pass</button>`;if(!a.canPass&&!a.canChallenge&&!a.canBlock)h+='<p class="muted">Waiting for other players to respond.</p>'}
else if(phase==='blockReaction'){h=`<div class="notice">${esc(person(q.blocker))} claims ${esc(q.blockRole)} to block ${esc(person(q.actor))}.</div>`;if(a.canChallenge)h+=`<button class="danger" onclick="send('challenge')">Challenge blocker</button> `;if(a.canPass)h+=`<button onclick="send('pass')">Accept block / pass</button>`;if(!a.canChallenge)h+='<p class="muted">Waiting for other players.</p>'}
else if(phase==='loss'){if(a.lose)h=`<div class="notice">You must lose one card: ${esc(s.lossReason)}</div><p class="small">Choose a card to discard secretly. The discarded card immediately returns to the draw deck.</p><div class="hand">${s.hand.map((x,i)=>card(x,`send('lose',{index:${i}})`)).join('')}</div>`;else h='<p class="muted">A player is choosing a card to discard privately.</p>'}
else if(phase==='coup'){h=a.survive?`<div class="notice">You were targeted by a coup. Pay 9 coins to survive or lose one card.</div><div class="actions"><button class="primary" ${me().coins<9?'disabled':''} onclick="send('coup',{survive:true})">Pay 9 coins</button><button class="danger" onclick="send('coup',{survive:false})">Lose a card</button></div>`:'<p class="muted">Target is deciding whether to survive.</p>'}
else if(phase==='police'){h=a.inspect?`<p>Inspected card belonging to ${esc(person(q.target))}:</p>${card(s.inspectedCard)}<div class="actions"><button onclick="send('police',{replace:false})">Keep card</button><button class="primary" onclick="send('police',{replace:true})">Replace card randomly</button></div>`:'<p class="muted">Police is privately inspecting a card.</p>'}
else if(phase==='politician'){h=a.choose?`<p>Select exactly ${s.hand.length} cards to keep from your four-card (or two-card) choice.</p><div class="hand">${s.choices.map((x,i)=>`<div id="opt${i}" onclick="pick(${i})">${card(x)}</div>`).join('')}</div><button class="primary" style="margin-top:15px" onclick="submitPick()">Keep selected cards</button>`:'<p class="muted">Politician is choosing new cards.</p>'}
else if(phase==='colonelProof'){h=a.exchange?`<p>Colonel accusation was false. Your current cards will be publicly revealed and replaced with fresh cards.</p><div class="hand">${s.proofHand.map(x=>card(x)).join('')}</div><button class="primary" onclick="send('exchange')">Show and exchange cards</button>`:'<p class="muted">Target is revealing and exchanging cards.</p>'}
else if(phase==='tax'){h=`<div class="notice">Business Woman ${esc(person(q.actor))} received four coins. Every other player may individually claim Tax Agent to collect one coin.</div>`;if(a.tax)h+=`<button class="primary" onclick="send('tax')">Claim Tax Agent: collect 1</button> `;if(a.canPass)h+=`<button onclick="send('pass')">Pass</button>`;if(!a.tax)h+='<p class="muted">Waiting on remaining players to decide about tax.</p>'}
else if(phase==='taxChallenge'){h=`<div class="notice">${esc(person(q.taxClaimant))} claims Tax Agent to collect from Business Woman.</div>`;if(a.canChallenge)h+=`<button class="danger" onclick="send('challenge')">Challenge this Tax Agent</button> `;if(a.canPass)h+=`<button onclick="send('pass')">Accept claim and pay 1 coin</button>`;if(!a.canChallenge)h+='<p class="muted">Waiting for other players.</p>'}
else h='<p class="muted">Waiting for the next move...</p>';e.innerHTML=h}
function takeAction(action){
 const target=$('target')?.value;
 if(action==='Colonel'){
  const controls=$('controls');
  let panel=$('colonel-accusation');
  if(!panel){
   panel=document.createElement('div');
   panel.id='colonel-accusation';panel.className='choicebox';
   panel.innerHTML='<h3>Colonel accusation</h3><p class="small">Choose the role you accuse your target of holding.</p><label for="colonel-role">Accused role</label><select id="colonel-role"><option value="">Choose a role...</option>'+roles.map(r=>'<option value="'+esc(r)+'">'+esc(r)+'</option>').join('')+'</select><div class="actions"><button class="primary" onclick="confirmColonel()">Confirm accusation (-4 coins)</button><button class="outline" onclick="document.getElementById(\'colonel-accusation\').remove()">Cancel</button></div>';
   controls.prepend(panel);
  }
  panel.dataset.target=target||'';panel.scrollIntoView({behavior:'smooth',block:'nearest'});return;
 }
 send('action',{action,target,accused:null});
}
function confirmColonel(){
 const role=$('colonel-role')?.value;
 if(!role)return toast('Select the role you want to accuse.');
 const target=$('colonel-accusation')?.dataset.target;
 if(!target)return toast('Choose a target player.');
 send('action',{action:'Colonel',target,accused:role});
}function pick(i){let n=s.hand.length;if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<n)selected.push(i);s.choices.forEach((_,j)=>$('opt'+j).classList.toggle('selected',selected.includes(j)));$('opt'+i).querySelector('img')?.classList.toggle('selected',selected.includes(i))}function submitPick(){if(selected.length!==s.hand.length)return toast(`Select ${s.hand.length} cards.`);send('politician',{indices:selected})}startPage();
</script></body></html>
